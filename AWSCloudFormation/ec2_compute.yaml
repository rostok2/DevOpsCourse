AWSTemplateFormatVersion: '2010-09-09'
Description: Creates EC2 instance using resources from other stacks.

Parameters:
  VPCId:
    Type: String
    Description: VPC ID from Network Stack
  SubnetId:
    Type: String
    Description: Public Subnet ID from Network Stack
  InstanceProfileName:
    Type: String
    Description: Instance Profile Name from IAM Stack
  AMIID:
    Type: String
    Description: AMI ID for Amazon Linux 2
    Default: ami-0036413a1289b6d37 

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref AMIID
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfileName
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: FinalEC2Instance

Outputs:
  EC2PublicIP:
    Description: Public IP address of the EC2 instance.
    Value: !GetAtt EC2Instance.PublicIp