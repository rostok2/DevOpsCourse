apiVersion: v1
kind: Pod
metadata:
  name: data-writer-pod
spec:
  containers:
  - name: writer
    image: busybox
    command: ["/bin/sh", "-c", "date >> /data/test.log; sleep 3600"]
    volumeMounts:
    - name: persistent-storage
      mountPath: /data
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: data-pvc
